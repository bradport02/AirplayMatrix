{% extends "base.html" %}
{% block title %}Log in — AirplayMatrix{% endblock %}
{% block content %}
{% from "_icons.html" import icon, logo %}
<div class="login-shell">
  {{ logo() }}
  <div class="card login-card">
    <h1>AirplayMatrix</h1>
    <p class="muted">Enter the admin password to manage this device.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password"><span class="label-text">{{ icon('lock') }} Password</span></label>
      <input id="password" type="password" name="password" autofocus required autocomplete="current-password">
      <button type="submit" class="primary" style="width:100%; justify-content:center;">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
